<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>教習コンシェルジュ</title>
  <meta name="description" content="教習進捗セルフチェック">
  <link rel="stylesheet" href="style.css">
  <style>.setting-select{display:block;width:100%;margin-top:9px;border:1px solid #cbd7e2;border-radius:11px;padding:12px;font-size:15px;font-weight:700;background:#fff;color:#142438}</style>
  <style>.clear-card{background:#fff;border:2px solid #159465;border-radius:16px;margin-top:10px;padding:12px}.clear-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.clear-title span{font-size:10px;color:#6f7f91;font-weight:800}.clear-title strong{font-size:18px;color:#159465}.clear-list{display:grid;gap:6px}.clear-item{display:flex;align-items:center;gap:8px;border-radius:10px;background:#f3f6f9;padding:9px;font-size:11px;font-weight:800}.clear-item input{width:19px;height:19px;margin:0;accent-color:#159465}.clear-item span{flex:1}.clear-item b{font-size:9px;color:#8b98a5}.clear-item.done{background:#eaf8f1;color:#126f50}.clear-item.done b{color:#159465}</style>
  <style>.counter strong small{display:block;font-size:7px;line-height:8px;color:#e34a32}.counter strong:has(small){color:#d43828;min-width:38px}.skill-entry p{line-height:1.4}</style>
  <style>.home-head+.license-pill+.guide{margin-top:0;margin-bottom:10px}</style>
  <style>.extra-badge{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:99px;background:#fff0ed;color:#cf3828;font-size:9px;font-weight:900}.extra-inline{color:#cf3828;font-size:9px;font-weight:900}.counter strong{min-width:30px!important;color:#142438!important}</style>
  <style>.topbar{display:none}.home-head{padding-top:8px}.status-card{margin-top:0;margin-bottom:10px}.status-card .guide{margin:12px -4px -4px;border-radius:14px;box-shadow:none}.deadline-grid{margin-bottom:10px}</style>
  <style>.pack-help{font-size:10px;line-height:1.55;color:#6f7f91;margin:8px 0 16px}.course-options,.license-options{flex-wrap:wrap}.course-options button,.license-options button{flex:1 1 calc(50% - 7px);padding:11px 6px}.course-options button:last-child{flex-basis:100%}.license-pill{margin:-7px 2px 8px;text-align:right;color:#6f7f91;font-size:10px;font-weight:700}.no-subjects p{font-size:10px;color:#6f7f91;margin:5px 0 0}.quick-title span,.quick-save,.shortcuts,.memo-card,.home-head~.deadline{display:none}.home-head{padding:12px 1px 7px}.quick{padding:13px}.quick-title{margin-bottom:7px}.quick-title h2{font-size:17px}.skill-entry{padding:10px 0}.subjects{padding-top:10px}.guide{background:linear-gradient(145deg,#bd291f,#ea4a35);padding:16px;margin-top:10px}.guide.urgent{background:linear-gradient(145deg,#8e1515,#c72720)}.guide h2{font-size:21px}.status-card{margin-top:10px;padding:13px}.deadline-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 10px}.deadline-tile{min-width:0;background:#fff;border:1px solid #dce4eb;border-radius:12px;padding:9px 7px}.deadline-tile span,.deadline-tile strong,.deadline-tile small{display:block;overflow:hidden;text-overflow:ellipsis}.deadline-tile span{font-size:9px;color:#6f7f91;white-space:nowrap}.deadline-tile strong{font-size:13px;margin:3px 0;color:#142438;white-space:nowrap}.deadline-tile small{font-size:8px;color:#6f7f91;white-space:nowrap}.deadline-tile.danger{border-color:#ef9c93;background:#fff4f2}.deadline-tile.danger strong{color:#c72720}.deadline-tile.muted{background:#f7f9fb}.field-help{display:block;font-size:9px;color:#6f7f91;margin-top:5px}.note{margin:9px 7px}</style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="logo">J</div>
      <div><b>教習コンシェルジュ</b><small>次にすることが、すぐ分かる</small></div>
      <span class="local">端末内保存</span>
    </header>
    <div id="screen"></div>
    <nav id="nav" hidden>
      <button data-tab="home" class="active"><i>⌂</i>ホーム</button>
      <a href="https://www.e-license.jp/el31/lOZqZKHC3uM-brGQYS-1OA%3D%3D" target="_blank" rel="noopener noreferrer"><i>▣</i>WEB予約</a>
      <a href="https://study.neumann-line.net/home" target="_blank" rel="noopener noreferrer"><i>▶</i>オンライン学科</a>
      <a href="https://www.musasi.jp/jds/requirements" target="_blank" rel="noopener noreferrer"><i>▤</i>ムサシ</a>
      <button data-tab="settings"><i>⚙</i>設定</button>
    </nav>
  </main>
  <style>
    .app{padding-left:10px;padding-right:10px;padding-bottom:74px}
    .home-head{padding:6px 1px 4px}.home-head h1{font-size:18px}.home-head p{font-size:9px}.pill{padding:5px 7px;font-size:9px}.license-pill{display:none}
    .deadline-grid{gap:5px;margin:0 0 6px}.deadline-tile{padding:6px 5px;border-radius:10px}.deadline-tile strong{font-size:12px;margin:2px 0}.deadline-tile span{font-size:8px}.deadline-tile small{font-size:7px}
    .status-card{padding:9px;margin-bottom:6px}.status-head{align-items:center}.status-head h3{display:none}.status-head strong{font-size:20px}.bar{height:6px;margin:6px 0}.stats{font-size:9px}.stats em{font-size:13px}
    .status-card .guide{padding:9px;margin:7px -2px -2px}.guide .label{font-size:8px;margin-bottom:3px}.guide h2{font-size:17px;margin-bottom:3px}.guide .detail{font-size:9px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .quick{padding:9px;border-radius:14px}.quick-title{margin-bottom:3px}.quick-title h2{font-size:14px}.skill-entry{padding:6px 0}.skill-entry b{font-size:11px}.skill-entry p{font-size:8px}.counter{gap:6px}.counter button{width:32px;height:32px}.counter strong{font-size:17px}
    .subjects{padding-top:6px}.subjects-head{margin-bottom:5px}.subjects-head b{font-size:10px}.subjects-head span{font-size:8px}.subject-grid{gap:4px}.subject-grid button{height:28px;aspect-ratio:auto;border-radius:6px;font-size:10px}
    .clear-card{padding:8px;margin-top:6px;border-radius:13px}.clear-title{margin-bottom:5px}.clear-title strong{font-size:15px}.clear-list{grid-template-columns:1fr 1fr;gap:4px}.clear-item{min-width:0;padding:6px 5px;gap:5px;font-size:9px}.clear-item input{width:16px;height:16px;flex:0 0 auto}.clear-item b{display:none}.note{display:none}
  </style>
  <style>
    .home-head h1{font-size:21px}.home-head p{font-size:10px}.pill{font-size:10px;padding:6px 8px}
    .deadline-tile{padding:8px 6px}.deadline-tile span{font-size:9px}.deadline-tile strong{font-size:14px}.deadline-tile small{font-size:8px}
    .status-head p{font-size:11px}.status-head strong{font-size:24px}.stats{font-size:11px}.stats em{font-size:16px}
    .guide .label{font-size:9px}.guide h2{font-size:20px}.guide .detail{font-size:11px;line-height:1.45}
    .quick{padding:11px}.quick-title h2{font-size:17px}.skill-entry{padding:8px 0}.skill-entry b{font-size:13px}.skill-entry p{font-size:10px}.counter button{width:36px;height:36px}.counter strong{font-size:20px}
    .subjects{padding-top:8px}.subjects-head b{font-size:12px}.subjects-head span{font-size:10px}.subject-grid button{height:33px;font-size:12px}
    .clear-card{padding:10px}.clear-title span{font-size:11px}.clear-title strong{font-size:18px}.clear-list{gap:6px}.clear-item{padding:8px 7px;font-size:11px}.clear-item input{width:18px;height:18px}
    nav button,nav a{font-size:10px}nav i{font-size:20px}
  </style>
  <script src="script.js?v=17"></script>

</html>
