  <style>.clear-card{background:#fff;border:2px solid #159465;border-radius:16px;margin-top:10px;padding:12px}.clear-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.clear-title span{font-size:10px;color:#6f7f91;font-weight:800}.clear-title strong{font-size:18px;color:#159465}.clear-list{display:grid;gap:6px}.clear-item{display:flex;align-items:center;gap:8px;border-radius:10px;background:#f3f6f9;padding:9px;font-size:11px;font-weight:800}.clear-item input{width:19px;height:19px;margin:0;accent-color:#159465}.clear-item span{flex:1}.clear-item b{font-size:9px;color:#8b98a5}.clear-item.done{background:#eaf8f1;color:#126f50}.clear-item.done b{color:#159465}</style>
  <style>.counter strong small{display:block;font-size:7px;line-height:8px;color:#e34a32}.counter strong:has(small){color:#d43828;min-width:38px}.skill-entry p{line-height:1.4}</style>
  <style>.home-head+.license-pill+.guide{margin-top:0;margin-bottom:10px}</style>
  <style>.extra-badge{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:99px;background:#fff0ed;color:#cf3828;font-size:9px;font-weight:900}.extra-inline{color:#cf3828;font-size:9px;font-weight:900}.counter strong{min-width:30px!important;color:#142438!important}</style>
  <style>.pack-help{font-size:10px;line-height:1.55;color:#6f7f91;margin:8px 0 16px}.course-options,.license-options{flex-wrap:wrap}.course-options button,.license-options button{flex:1 1 calc(50% - 7px);padding:11px 6px}.course-options button:last-child{flex-basis:100%}.license-pill{margin:-7px 2px 8px;text-align:right;color:#6f7f91;font-size:10px;font-weight:700}.no-subjects p{font-size:10px;color:#6f7f91;margin:5px 0 0}.quick-title span,.quick-save,.shortcuts,.memo-card,.home-head~.deadline{display:none}.home-head{padding:12px 1px 7px}.quick{padding:13px}.quick-title{margin-bottom:7px}.quick-title h2{font-size:17px}.skill-entry{padding:10px 0}.subjects{padding-top:10px}.guide{background:linear-gradient(145deg,#bd291f,#ea4a35);padding:16px;margin-top:10px}.guide.urgent{background:linear-gradient(145deg,#8e1515,#c72720)}.guide h2{font-size:21px}.status-card{margin-top:10px;padding:13px}.deadline-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 10px}.deadline-tile{min-width:0;background:#fff;border:1px solid #dce4eb;border-radius:12px;padding:9px 7px}.deadline-tile span,.deadline-tile strong,.deadline-tile small{display:block;overflow:hidden;text-overflow:ellipsis}.deadline-tile span{font-size:9px;color:#6f7f91;white-space:nowrap}.deadline-tile strong{font-size:13px;margin:3px 0;color:#142438;white-space:nowrap}.deadline-tile small{font-size:8px;color:#6f7f91;white-space:nowrap}.deadline-tile.danger{border-color:#ef9c93;background:#fff4f2}.deadline-tile.danger strong{color:#c72720}.deadline-tile.muted{background:#f7f9fb}.field-help{display:block;font-size:9px;color:#6f7f91;margin-top:5px}.note{margin:9px 7px}</style>
